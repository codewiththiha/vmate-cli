[workspace]
resolver = "3"
members = [
    "crates/vmate-core",
    "crates/vmate-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "1.2.0"
license = "MIT"
authors = ["codewiththiha"]

[workspace.dependencies]
# Async runtime. Deliberately NOT `full`: vmate only needs process spawning,
# timers, signals, mpsc, DNS lookup, and the runtime itself — trimming the
# rest (fs, async stdio, most of net) keeps the binary noticeably smaller.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "signal",
    "sync",
    "io-util",
    "net",
] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap-verbosity-flag = "3"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }

# HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"

# Filesystem
walkdir = "2"
directories = "5"
shellexpand = "3"
tempfile = "3"

# Sync primitives (poison-free mutexes)
parking_lot = "0.12"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Randomization
rand = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Terminal / UX
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
comfy-table = "7"
# Text clipboard only: disabling the default `image-data` feature drops the
# heavy `image` crate (only needed for copying image data, which vmate never
# does). Text copy still works on every platform.
arboard = { version = "3", default-features = false }
base64 = "0.22"
url = "2"

# Unix process control
nix = { version = "0.29", features = ["signal", "process", "user"] }

# Testing
assert_cmd = "2"
predicates = "3"

[profile.release]
# Maximal size optimization: smallest code, full LTO, single codegen unit,
# fully stripped (no symbol table or debuginfo). `panic = "abort"` drops the
# unwinder and panic-unwind path (a CLI has no use for unwinding across the
# FFI boundary), shaving a few hundred KB.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# macOS 26+/27 dyld rejects dylibs whose LINKEDIT string pool is misaligned.
# rustc < 1.96 with stripped debuginfo can emit such proc-macro dylibs
# (rust-lang/rust#157750: "mis-aligned LINKEDIT string pool"), which makes
# sqlx_macros fail to dlopen. Building build-dependencies (which include every
# proc-macro crate) unoptimized and unstripped avoids the corrupt layout while
# the final binary is still fully optimized and stripped.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
strip = "none"
