[workspace]
resolver = "3"
members = [
    "crates/vmate-core",
    "crates/vmate-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"
authors = ["Vmate contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap-verbosity-flag = "3"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }

# HTTP / JSON
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"

# Filesystem
walkdir = "2"
directories = "5"
shellexpand = "3"
tempfile = "3"

# Sync primitives (poison-free mutexes)
parking_lot = "0.12"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Randomization
rand = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Terminal / UX
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
comfy-table = "7"
arboard = "3"
base64 = "0.22"
url = "2"

# Unix process control
nix = { version = "0.29", features = ["signal", "process", "user"] }

# Testing
assert_cmd = "2"
predicates = "3"

[profile.release]
# Size-optimized release build.
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

# macOS 26+/27 dyld rejects dylibs whose LINKEDIT string pool is misaligned.
# rustc < 1.96 with stripped debuginfo can emit such proc-macro dylibs
# (rust-lang/rust#157750: "mis-aligned LINKEDIT string pool"), which makes
# sqlx_macros fail to dlopen. Building build-dependencies (which include every
# proc-macro crate) unoptimized and unstripped avoids the corrupt layout while
# the final binary is still fully optimized and stripped.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
strip = "none"
