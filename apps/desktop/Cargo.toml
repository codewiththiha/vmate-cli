[package]
name = "vmate-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
build = "build.rs"

[dependencies]
vmate-engine = { path = "../../crates/vmate-engine" }
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "unstable-winit-030"] }
anyhow.workspace = true
arboard.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
isocountry = "0.3"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
slint-build = "=1.19.0"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
rustix = { version = "1", features = ["process", "net"] }
