name: desktop-review
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an experimental GUI prerelease after all checks
        type: boolean
        default: false
      release_tag:
        description: Desktop-only prerelease tag (must not start with v)
        type: string
        default: desktop-v1.2.4-alpha.2
  push:
    branches: [main, feat/slint-desktop, fix/desktop-input-tray]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libfontconfig1-dev fonts-dejavu-core xvfb openbox xdotool x11-utils dbus-x11 python3-venv
      - run: python3 -m unittest discover -s packaging/tests -v
      - run: python3 tools/shape_check.py --dups
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: CLI and desktop shared-storage contract
        run: cargo test -p vmate-cli --test desktop_parity --locked -- --nocapture
      - run: cargo test --workspace --locked
      - run: cargo build -p vmate-desktop --locked
      - run: target/debug/vmate-desktop --capture-dir review/screenshots
      - run: python3 tools/review_screenshots.py review/screenshots
      - run: xvfb-run -a python3 tools/native_smoke.py target/debug/vmate-desktop > review/native-linux.json
      - name: Real tray lifecycle against a disposable D-Bus host
        run: |
          python3 -m venv /tmp/vmate-tray-tests
          /tmp/vmate-tray-tests/bin/pip install dbus-next==0.2.3
          dbus-run-session -- xvfb-run -a /tmp/vmate-tray-tests/bin/python tools/tray_smoke.py target/debug/vmate-desktop > review/tray-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slint-headless-review
          path: review/
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libfontconfig1-dev libssl-dev liblzo2-dev liblz4-dev libcap-ng-dev patchelf pkg-config rpm zstd libarchive-tools
      - if: runner.os == 'macOS'
        run: |
          brew install openssl@3 lzo lz4 pkgconf dylibbundler cairo
          python3 -m venv /tmp/vmate-icons
          /tmp/vmate-icons/bin/pip install cairosvg
          echo /tmp/vmate-icons/bin >> "$GITHUB_PATH"
      - run: cargo test -p vmate-core -p vmate-engine --locked
      - run: cargo build -p vmate-cli -p vmate-desktop --release --locked
      - name: Retain Rust dependency notices and matching source archives
        run: |
          python3 packaging/rust-notices.py license-assets
          mkdir -p packages
          cp license-assets/rust-sources-*.tar.gz packages/
          cp license-assets/rust-inventory.json packages/rust-inventory-${{ matrix.platform }}-${{ matrix.arch }}.json
          cp license-assets/THIRD-PARTY-NOTICES.txt packages/THIRD-PARTY-NOTICES-${{ matrix.platform }}-${{ matrix.arch }}.txt
      - name: Stage both editions
        run: |
          python3 packaging/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant system --binaries target/release --output packages --notices license-assets/THIRD-PARTY-NOTICES.txt ${{ runner.os == 'Linux' && '--native-formats' || '' }}
          python3 packaging/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --variant bundled --binaries target/release --output packages --notices license-assets/THIRD-PARTY-NOTICES.txt ${{ runner.os == 'Linux' && '--native-formats' || '' }}
      - name: Validate package contents and private executable
        run: python3 tools/package_check.py packages
      - name: Native archive payload and dependency parity
        if: runner.os == 'Linux'
        run: python3 tools/native_package_check.py packages
      - name: Install each native package in a disposable distribution
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.publish
        run: python3 tools/native_package_check.py packages --install
      - name: Linux user installer smoke
        if: runner.os == 'Linux'
        run: python3 tools/install_smoke.py packages
      - name: Keep platform checksum manifests distinct
        if: success()
        run: mv packages/checksums.json packages/checksums-${{ matrix.platform }}-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}-review
          path: |
            packages/*.deb
            packages/*.tar.gz
            packages/*.dmg
            packages/*.rpm
            packages/*.pkg.tar.zst
            packages/*.json
            packages/*.txt
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [linux-review, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-review
          path: release-assets
          merge-multiple: true
      - name: Publish verified experimental GUI assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/publish_desktop.py release-assets
