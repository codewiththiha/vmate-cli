# Build vmate-cli for macOS and Linux, then publish a GitHub Release when a
# version tag (vX.Y.Z) is pushed. Each zip bundles the binary plus install.sh,
# which copies the binary onto the user's PATH.
#
# vmate-cli is Unix-only (process groups, root checks, killall), so Windows is
# intentionally not built. Tag with:
#     git tag v1.0.1 && git push origin v1.0.1

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin     # Apple Silicon Macs (native on the arm64 runner)
            os: macos-latest
          - target: x86_64-apple-darwin      # Intel Macs (cross-built from the arm64 runner)
            os: macos-latest
          - target: x86_64-unknown-linux-gnu # most servers / desktops
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu # ARM servers (Raspberry Pi, AWS Graviton)
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux cross C toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Point aarch64 Linux build at the cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Ensure tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error title=Version mismatch::tag ${GITHUB_REF_NAME} but Cargo.toml is ${CARGO_VER}; bump one to match."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage and zip (binary + install.sh)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="vmate-cli-$VERSION-$TARGET"
          mkdir -p "dist/$STAGE"
          cp "target/$TARGET/release/vmate-cli" "dist/$STAGE/vmate-cli"
          cp install.sh "dist/$STAGE/install.sh"
          chmod +x "dist/$STAGE/vmate-cli" "dist/$STAGE/install.sh"
          (cd dist && zip -qr "$STAGE.zip" "$STAGE")
          echo "asset=dist/$STAGE.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Write SHA256 checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          find . -name '*.zip' -type f -print0 | sort -z | xargs -0 shasum -a 256 > "vmate-cli-${VERSION}-SHA256SUMS.txt"
          cp "vmate-cli-${VERSION}-SHA256SUMS.txt" "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            *SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
