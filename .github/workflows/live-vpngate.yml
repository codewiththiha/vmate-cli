name: live-vpngate

on:
  workflow_dispatch:
  push:
    branches: [fix/linux-session-lifecycle, fix/scan-upgrade-compatibility, feat/slint-desktop, release/desktop-alpha3]
    paths:
      - .github/workflows/live-vpngate.yml
      - tools/live_vpngate.py
      - apps/cli/src/**
      - crates/vmate-core/src/**
      - tools/linux_state.py
      - crates/vmate-engine/**
      - apps/cli/tests/desktop_parity.rs
      - Cargo.lock

permissions:
  contents: read

jobs:
  linux-public-relays:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p vmate-cli -p vmate-engine --examples --bins --locked
      - name: Test built-in relays in disposable network
        run: |
          mkdir -p evidence
          docker run --rm --privileged \
            --device /dev/net/tun \
            -v "$PWD:/workspace:ro" -v "$PWD/evidence:/evidence" \
            ubuntu:24.04 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                openvpn python3 python3-pyte iproute2 procps ca-certificates
              uname -a > /evidence/platform.txt
              openvpn --version >> /evidence/platform.txt
              cli_status=0
              python3 /workspace/tools/live_vpngate.py || cli_status=$?
              export PYTHONPATH=/workspace/tools
              python3 -c "from linux_state import network_state; print(network_state())" > /evidence/engine-before.txt
              runuser -u nobody -- /workspace/target/debug/examples/desktop_probe \
                /tmp/live.db /tmp/engine-cli-history openvpn recent > /evidence/engine-cli-history.json
              runuser -u nobody -- /workspace/target/debug/examples/desktop_probe \
                /tmp/engine.db /tmp/engine-scan openvpn scan > /evidence/engine-scan.json
              runuser -u nobody -- /workspace/target/debug/vmate-cli \
                --db /tmp/engine.db recent --no-tui --all > /evidence/cli-engine-history.txt
              grep -q "opengw.net" /evidence/cli-engine-history.txt
              python3 -c "from linux_state import network_state; print(network_state())" > /evidence/engine-after.txt
              cmp /evidence/engine-before.txt /evidence/engine-after.txt
              ! pgrep -x openvpn
              test "$cli_status" = 0
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                curl build-essential pkg-config libssl-dev libcap-ng-dev
              cd /tmp
              curl -fsSLO https://swupdate.openvpn.org/community/releases/openvpn-2.7.8.tar.gz
              echo "c070d1d2440b5a6fca6c2c68645c98cd492116ac36ef4f0946177115532c8e36  openvpn-2.7.8.tar.gz" | sha256sum -c -
              tar -xzf openvpn-2.7.8.tar.gz
              cd openvpn-2.7.8
              ./configure --disable-lzo --disable-lz4 --disable-dco \
                --disable-plugin-auth-pam --disable-systemd
              make -j2
              src/openvpn/openvpn --version > /evidence/openvpn27-platform.txt
              export PYTHONPATH=/workspace/tools
              python3 -c "from linux_state import network_state; print(network_state())" > /evidence/openvpn27-before.txt
              runuser -u nobody -- env XDG_CONFIG_HOME=/tmp/vmate27-config \
                /workspace/target/debug/vmate-cli --db /tmp/vmate27.db \
                --openvpn-bin /tmp/openvpn-2.7.8/src/openvpn/openvpn \
                scan --max 64 -t 5 --verbose > /evidence/openvpn27-scan.txt 2>&1
              grep -q "Scanned:       277" /evidence/openvpn27-scan.txt
              grep -Eq "Found total:   [1-9]" /evidence/openvpn27-scan.txt
              python3 -c "from linux_state import network_state; print(network_state())" > /evidence/openvpn27-after.txt
              cmp /evidence/openvpn27-before.txt /evidence/openvpn27-after.txt
            '
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-public-vpngate-evidence
          path: evidence/
          retention-days: 7
