# Lint + test gate on every push/PR to main.
#
# The README documents `cargo fmt --check`, `cargo clippy --all-targets
# -- -D warnings`, and `cargo test` as the quality bar; this job enforces it
# so nothing lands that doesn't pass its own checks. Warnings are errors two
# ways: clippy runs with `-D warnings` (so a rustc warning fails too), and the
# workspace lints table promotes the rustc `unused` group to `deny`, so even a
# plain `cargo check` — the step below — fails on dead code and unused imports.
# Releases are handled separately by `release.yml` (tag-triggered).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS both: vmate-cli ships for both, and they differ
        # exactly where it hurts (sudo resets HOME on Linux, process groups and
        # `killall` behave differently), so a green Linux alone proves little.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Warnings (workspace lints deny unused code and unsafe)
        run: cargo check --workspace --all-targets --locked

      - name: Docs (broken links as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Test
        run: cargo test --workspace --locked
