# Lint + test gate on every push/PR to main.
#
# The README documents `cargo fmt --check`, `cargo clippy --all-targets
# -- -D warnings`, and `cargo test` as the quality bar; this job enforces it
# so nothing lands that doesn't pass its own checks. Warnings are errors two
# ways: clippy runs with `-D warnings` (so a rustc warning fails too), and the
# workspace lints table promotes the rustc `unused` group to `deny`, so even a
# plain `cargo check` — the step below — fails on dead code and unused imports.
# Releases are handled separately by `release.yml` (tag-triggered).

name: ci

on:
  push:
    branches: [main, fix/linux-session-lifecycle, fix/scan-upgrade-compatibility, feat/slint-desktop, fix/desktop-input-tray, fix/desktop-theme-countries, fix/desktop-session-controls, fix/desktop-settings-selection]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS both: vmate-cli ships for both, and they differ
        # exactly where it hurts (sudo resets HOME on Linux, process groups and
        # `killall` behave differently), so a green Linux alone proves little.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Shape and duplication
        run: python3 tools/shape_check.py --dups

      - name: Commit policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/commit_check.py --range "$BASE_SHA..$HEAD_SHA"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev fonts-dejavu-core

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Warnings (workspace lints deny unused code and unsafe)
        run: cargo check --workspace --all-targets --locked

      - name: Docs (broken links as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Linux sudo cache upgrade
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          python3 tools/scan_upgrade.py target/debug/vmate-cli
